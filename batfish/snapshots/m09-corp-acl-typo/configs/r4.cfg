!
! Last configuration change at 00:00:00 UTC Mon Jan 1 2024
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname r4
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
ip cef
no ipv6 cef
!
interface Loopback0
 description router-id and management
 ip address 10.255.0.4 255.255.255.255
!
interface GigabitEthernet0/0
 description LINK TO r2 GigabitEthernet0/1
 ip address 10.0.24.2 255.255.255.252
 ip ospf cost 10
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description LINK TO r3 GigabitEthernet0/1
 ip address 10.0.34.2 255.255.255.252
 ip ospf cost 10
 duplex auto
 speed auto
!
interface GigabitEthernet0/2
 description SERVER LAN
 ip address 192.168.20.1 255.255.255.0
 ip access-group SERVER_POLICY out
 duplex auto
 speed auto
!
ip forward-protocol nd
!
ip access-list extended SERVER_POLICY
 remark INTENT: only the PC LAN may reach the server LAN, and only HTTP, HTTPS and ICMP
 permit tcp 192.168.10.0 0.0.0.0 192.168.20.0 0.0.0.255 eq www
 permit tcp 192.168.10.0 0.0.0.255 192.168.20.0 0.0.0.255 eq 443
 permit icmp 192.168.10.0 0.0.0.255 192.168.20.0 0.0.0.255
 deny   ip any any
!
router ospf 1
 router-id 10.255.0.4
 passive-interface GigabitEthernet0/2
 network 10.255.0.4 0.0.0.0 area 0
 network 10.0.24.0 0.0.0.3 area 0
 network 10.0.34.0 0.0.0.3 area 0
 network 192.168.20.0 0.0.0.255 area 0
!
line con 0
line vty 0 4
 login
!
end
