!
! Last configuration change at 00:00:00 UTC Mon Jan 1 2024
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname r3
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
ip cef
no ipv6 cef
!
interface Loopback0
 description router-id and management
 ip address 10.255.0.3 255.255.255.255
!
interface GigabitEthernet0/0
 description BACKUP LINK TO r1 GigabitEthernet0/2
 ip address 10.0.13.2 255.255.255.252
 ip ospf cost 100
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description LINK TO r4 GigabitEthernet0/1
 ip address 10.0.34.1 255.255.255.252
 ip ospf cost 10
 ip access-group BACKUP_PATH_FILTER out
 duplex auto
 speed auto
!
ip forward-protocol nd
!
ip access-list extended BACKUP_PATH_FILTER
 remark INTENT: the backup path is lower-capacity, so only ICMP and plain HTTP ride it
 permit icmp any any
 permit tcp any any eq www
 deny   ip any any
!
router ospf 1
 router-id 10.255.0.3
 network 10.255.0.3 0.0.0.0 area 0
 network 10.0.13.0 0.0.0.3 area 0
 network 10.0.34.0 0.0.0.3 area 0
!
line con 0
line vty 0 4
 login
!
end
