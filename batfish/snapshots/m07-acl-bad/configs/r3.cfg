!
! Last configuration change at 00:00:00 UTC Mon Jan 1 2024
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname r3
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
ip cef
no ipv6 cef
!
interface Loopback0
 description router-id and management
 ip address 10.0.0.3 255.255.255.255
!
interface GigabitEthernet0/0
 description LINK TO r2 GigabitEthernet0/1
 ip address 10.1.23.2 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description SERVER LAN
 ip address 192.168.3.1 255.255.255.0
 ip access-group SERVER_PROTECT out
 duplex auto
 speed auto
!
ip forward-protocol nd
!
ip access-list extended SERVER_PROTECT
 remark INTENT: allow the host LAN to the server LAN, but never allow SSH
 permit ip 192.168.1.0 0.0.0.255 192.168.3.0 0.0.0.255
 deny   tcp 192.168.1.0 0.0.0.255 192.168.3.0 0.0.0.255 eq 22
 permit icmp any any
 deny   ip any any
!
router ospf 1
 router-id 10.0.0.3
 passive-interface GigabitEthernet0/1
 network 10.0.0.3 0.0.0.0 area 0
 network 10.1.23.0 0.0.0.3 area 0
 network 192.168.3.0 0.0.0.255 area 0
!
line con 0
line vty 0 4
 login
!
end