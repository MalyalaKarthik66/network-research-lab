!
! Last configuration change at 00:00:00 UTC Mon Jan 1 2024
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname r2
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
ip cef
no ipv6 cef
!
interface Loopback0
 description router-id and management
 ip address 10.0.0.2 255.255.255.255
!
interface GigabitEthernet0/0
 description LINK TO r1 GigabitEthernet0/0
 ip address 10.1.12.2 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description LINK TO r3 GigabitEthernet0/0
 ip address 10.1.23.1 255.255.255.252
 duplex auto
 speed auto
!
ip forward-protocol nd
!
router bgp 65002
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 neighbor 10.1.12.1 remote-as 65001
 neighbor 10.1.12.1 description eBGP to r1
 neighbor 10.1.23.2 remote-as 65003
 neighbor 10.1.23.2 description eBGP to r3
!
line con 0
line vty 0 4
 login
!
end