!
! Last configuration change at 00:00:00 UTC Mon Jan 1 2024
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname r1
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
ip cef
no ipv6 cef
!
interface Loopback0
 description router-id and management
 ip address 10.0.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description LINK TO r2 GigabitEthernet0/0
 ip address 10.1.12.1 255.255.255.252
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 description HOST LAN (PC side)
 ip address 192.168.1.1 255.255.255.0
 duplex auto
 speed auto
!
ip forward-protocol nd
!
router bgp 65001
 bgp router-id 10.0.0.1
 bgp log-neighbor-changes
 network 192.168.1.0 mask 255.255.255.0
 neighbor 10.1.12.2 remote-as 65002
 neighbor 10.1.12.2 description eBGP to r2
!
line con 0
line vty 0 4
 login
!
end