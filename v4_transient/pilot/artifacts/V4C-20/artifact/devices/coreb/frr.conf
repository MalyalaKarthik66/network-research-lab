frr version 8.4.1
frr defaults traditional
hostname coreb
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to corea core-link
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to distb1 cB1
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth3
 description link to distb2 cB2
 ip ospf area 0.0.0.0
 ip ospf cost 20
 ip ospf network point-to-point
!
ip route 10.255.0.9/32 blackhole
!
router ospf
 ospf router-id 10.255.0.7
 passive-interface lo
!
line vty
!
