frr version 8.4.1
frr defaults traditional
hostname mid
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to a1 M1
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to a2 M2
 ip ospf area 0.0.0.0
 ip ospf cost 420
 ip ospf network point-to-point
!
interface eth3
 description link to b1 M3
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth4
 description link to b2 M4
 ip ospf area 0.0.0.0
 ip ospf cost 21
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.4
 passive-interface lo
!
line vty
!
