dista2
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.4/32
    alias router-id and management

auto eth1
iface eth1
    address 10.25.3.2/30
    alias link to acca1 dA1b

auto eth2
iface eth2
    address 10.25.5.2/30
    alias link to acca2 dA2

auto eth3
iface eth3
    address 10.25.7.1/30
    alias link to corea cA2

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname dista2
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to acca1 dA1b
 ip ospf area 0.0.0.0
 ip ospf cost 30
 ip ospf network point-to-point
!
interface eth2
 description link to acca2 dA2
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth3
 description link to corea cA2
 ip ospf area 0.0.0.0
 ip ospf cost 400
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.4
 passive-interface lo
!
line vty
!
