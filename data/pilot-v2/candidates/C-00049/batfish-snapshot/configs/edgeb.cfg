edgeb
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.4/32
    alias router-id and management

auto eth1
iface eth1
    address 10.20.0.1/24
    alias link to hostb siteB-lan1

auto eth2
iface eth2
    address 10.21.0.1/24
    alias link to hostc siteB-lan2

auto eth3
iface eth3
    address 10.11.3.2/30
    alias link to coreb siteB

auto eth4
iface eth4
    address 10.11.4.2/30
    alias link to edgea wan-backup

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname edgeb
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to hostb siteB-lan1
 ip ospf area 0.0.0.0
 ip ospf cost 10
!
interface eth2
 description link to hostc siteB-lan2
 ip ospf area 0.0.0.0
 ip ospf cost 10
!
interface eth3
 description link to coreb siteB
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth4
 description link to edgea wan-backup
 ip ospf area 0.0.0.0
 ip ospf cost 100
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.4
 passive-interface lo
!
line vty
!
