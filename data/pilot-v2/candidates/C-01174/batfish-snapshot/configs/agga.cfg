agga
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.13/32
    alias router-id and management

auto eth1
iface eth1
    address 10.26.16.2/30
    alias link to edgea aggA (partially reverted)

auto eth2
iface eth2
    address 10.26.17.1/30
    alias link to p1 aggA2

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname agga
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to edgea aggA (partially reverted)
 ip ospf area 0.0.0.0
 ip ospf cost 60
 ip ospf network point-to-point
!
interface eth2
 description link to p1 aggA2
 ip ospf area 0.0.0.0
 ip ospf cost 60
 ip ospf network point-to-point
!
ip route 10.20.0.0/24 10.26.16.1
!
router ospf
 ospf router-id 10.255.0.13
 passive-interface lo
!
line vty
!
