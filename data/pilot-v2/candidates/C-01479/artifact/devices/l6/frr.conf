frr version 8.4.1
frr defaults traditional
hostname l6
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to l3 ll
 ip ospf area 0.0.0.0
 ip ospf cost 60
 ip ospf network point-to-point
!
interface eth2
 description link to s2 ls6
 ip ospf area 0.0.0.0
 ip ospf cost 20
 ip ospf network point-to-point
!
ip route 192.0.2.0/24 blackhole
!
router ospf
 ospf router-id 10.255.0.7
 passive-interface lo
!
line vty
!
