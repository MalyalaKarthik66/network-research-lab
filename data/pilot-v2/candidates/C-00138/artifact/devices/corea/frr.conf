frr version 8.4.1
frr defaults traditional
hostname corea
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to edgea siteA (partially reverted)
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to wan1 wanA
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth3
 description link to coreb wan-backup
 ip ospf area 0.0.0.0
 ip ospf cost 100
 ip ospf network point-to-point
!
ip route 10.20.0.0/24 10.12.1.1
!
router ospf
 ospf router-id 10.255.0.2
 passive-interface lo
!
line vty
!
