mgmt
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.13/32
    alias router-id and management

auto eth1
iface eth1
    address 10.27.13.2/30
    alias link to agga mgmtA

auto eth2
iface eth2
    address 10.27.14.1/30
    alias link to aggb mgmtB

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname mgmt
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to agga mgmtA
 ip ospf area 0.0.0.0
 ip ospf cost 80
 ip ospf network point-to-point
!
interface eth2
 description link to aggb mgmtB
 ip ospf area 0.0.0.0
 ip ospf cost 80
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.13
 passive-interface lo
!
line vty
!
