frr version 8.4.1
frr defaults traditional
hostname dista
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to edgea accA
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to agga aggA
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth3
 description link to distb dist-xlink
 ip ospf area 0.0.0.0
 ip ospf cost 150
 ip ospf network point-to-point
!
ip route 192.0.2.0/24 blackhole
!
router ospf
 ospf router-id 10.255.0.2
 passive-interface lo
!
line vty
!
