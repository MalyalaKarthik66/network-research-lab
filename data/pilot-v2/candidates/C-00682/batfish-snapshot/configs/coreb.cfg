coreb
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.6/32
    alias router-id and management

auto eth1
iface eth1
    address 10.20.5.2/30
    alias link to wan2 wB

auto eth2
iface eth2
    address 10.20.6.1/30
    alias link to aggb aggB

auto eth3
iface eth3
    address 10.20.8.2/30
    alias link to corea wan-backup

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname coreb
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to wan2 wB
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to aggb aggB
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth3
 description link to corea wan-backup
 ip ospf area 0.0.0.0
 ip ospf cost 100
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.6
 passive-interface lo
 passive-interface eth3
!
line vty
!
