wan3
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.6/32
    alias router-id and management

auto eth1
iface eth1
    address 10.13.5.2/30
    alias link to corea wanA2

auto eth2
iface eth2
    address 10.13.6.1/30
    alias link to wan4 wan-secondary

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname wan3
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to corea wanA2
 ip ospf area 0.0.0.0
 ip ospf cost 20
 ip ospf network point-to-point
!
interface eth2
 description link to wan4 wan-secondary
 ip ospf area 0.0.0.0
 ip ospf cost 20
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.6
 passive-interface lo
!
line vty
!
