frr version 8.4.1
frr defaults traditional
hostname corea
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to edgea siteA
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to coreb wan-primary
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
ip route 10.20.0.0/24 blackhole
ip route 10.20.0.10/32 10.11.4.2
!
router ospf
 ospf router-id 10.255.0.2
 passive-interface lo
!
line vty
!
