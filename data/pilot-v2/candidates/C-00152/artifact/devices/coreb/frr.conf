frr version 8.4.1
frr defaults traditional
hostname coreb
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to wan2 wanB1
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to wan4 wanB2
 ip ospf area 0.0.0.9
 ip ospf cost 20
 ip ospf network point-to-point
!
interface eth3
 description link to edgeb siteB
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth4
 description link to corea wan-backup
 ip ospf area 0.0.0.0
 ip ospf cost 100
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.5
 passive-interface lo
!
line vty
!
