p4
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.9/32
    alias router-id and management

auto eth1
iface eth1
    address 10.26.8.2/30
    alias link to p3 core2

auto eth2
iface eth2
    address 10.26.9.1/30
    alias link to pe4 peB2

auto eth3
iface eth3
    address 10.26.12.2/30
    alias link to p2 xlink2

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname p4
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to p3 core2
 ip ospf area 0.0.0.0
 ip ospf cost 30
 ip ospf network point-to-point
!
interface eth2
 description link to pe4 peB2
 ip ospf area 0.0.0.0
 ip ospf cost 30
 ip ospf network point-to-point
!
interface eth3
 description link to p2 xlink2
 ip ospf area 0.0.0.0
 ip ospf cost 50
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.9
 passive-interface lo
!
line vty
!
