edgea
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.1/32
    alias router-id and management

auto eth1
iface eth1
    address 10.10.0.1/24
    alias link to hosta siteA-lan

auto eth2
iface eth2
    address 10.26.1.1/30
    alias link to pe1 peA1

auto eth3
iface eth3
    address 10.26.6.1/30
    alias link to pe2 peA2

auto eth4
iface eth4
    address 10.26.16.1/30
    alias link to agga aggA

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname edgea
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to hosta siteA-lan
 ip ospf area 0.0.0.0
 ip ospf cost 10
!
interface eth2
 description link to pe1 peA1
 ip ospf area 0.0.0.0
 ip ospf cost 18
 ip ospf network point-to-point
!
interface eth3
 description link to pe2 peA2
 ip ospf area 0.0.0.0
 ip ospf cost 30
 ip ospf network point-to-point
!
interface eth4
 description link to agga aggA
 ip ospf area 0.0.0.0
 ip ospf cost 60
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.1
 passive-interface lo
 passive-interface eth1
!
line vty
!
