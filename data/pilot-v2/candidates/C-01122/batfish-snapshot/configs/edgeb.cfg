edgeb
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.6/32
    alias router-id and management

auto eth1
iface eth1
    address 10.20.0.1/24
    alias link to hostb siteB-lan1

auto eth2
iface eth2
    address 10.21.0.1/24
    alias link to hostc siteB-lan2

auto eth3
iface eth3
    address 10.26.5.2/30
    alias link to pe3 peB

auto eth4
iface eth4
    address 10.26.10.2/30
    alias link to pe4 peB2b

auto eth5
iface eth5
    address 10.26.18.1/30
    alias link to aggb aggB

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname edgeb
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to hostb siteB-lan1
 ip ospf area 0.0.0.0
 ip ospf cost 10
!
interface eth2
 description link to hostc siteB-lan2
 ip ospf area 0.0.0.0
 ip ospf cost 10
!
interface eth3
 description link to pe3 peB
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
 shutdown
!
interface eth4
 description link to pe4 peB2b
 ip ospf area 0.0.0.0
 ip ospf cost 30
 ip ospf network point-to-point
!
interface eth5
 description link to aggb aggB
 ip ospf area 0.0.0.0
 ip ospf cost 60
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.6
 passive-interface lo
 passive-interface eth1
 passive-interface eth2
!
line vty
!
