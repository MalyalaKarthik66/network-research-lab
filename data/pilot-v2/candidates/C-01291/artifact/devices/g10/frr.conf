frr version 8.4.1
frr defaults traditional
hostname g10
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to g9 r2d
 ip ospf area 0.0.0.0
 ip ospf cost 20
 ip ospf network point-to-point
!
interface eth2
 description link to g5 rung3
 ip ospf area 0.0.0.0
 ip ospf cost 30
 ip ospf network point-to-point
!
interface eth3
 description link to edgeb accB2
 ip ospf area 0.0.0.0
 ip ospf cost 40
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.11
 passive-interface lo
!
line vty
!
