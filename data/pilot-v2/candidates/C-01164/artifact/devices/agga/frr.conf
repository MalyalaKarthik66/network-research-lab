frr version 8.4.1
frr defaults traditional
hostname agga
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to edgea aggA
 ip ospf area 0.0.0.0
 ip ospf cost 60
 ip ospf network point-to-point
!
interface eth2
 description link to p1 aggA2
 ip ospf area 0.0.0.9
 ip ospf cost 60
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.13
 passive-interface lo
!
line vty
!
