coreb
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.5/32
    alias router-id and management

auto eth1
iface eth1
    address 10.21.4.2/30
    alias link to fw2 fwB

auto eth2
iface eth2
    address 10.21.5.1/30
    alias link to edgeb siteB

auto eth3
iface eth3
    address 10.21.6.2/30
    alias link to corea wan-backup

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname coreb
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to fw2 fwB
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to edgeb siteB
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth3
 description link to corea wan-backup
 ip ospf area 0.0.0.0
 ip ospf cost 120
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.5
 passive-interface lo
 passive-interface eth2
!
line vty
!
