frr version 8.4.1
frr defaults traditional
hostname edgeb
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to hostb siteB-lan1
 ip ospf area 0.0.0.0
 ip ospf cost 10
!
interface eth2
 description link to hostc siteB-lan2
 ip ospf area 0.0.0.0
 ip ospf cost 10
!
interface eth3
 description link to b1 B1
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf network point-to-point
!
interface eth4
 description link to b2 B2
 ip ospf area 0.0.0.0
 ip ospf cost 20
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.7
 passive-interface lo
 passive-interface eth1
 passive-interface eth2
!
line vty
!
