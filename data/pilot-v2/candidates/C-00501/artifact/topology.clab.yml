name: nrlv2-c-00501

topology:
  nodes:
    agga:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - devices/agga/frr.conf:/etc/frr/frr.conf
        - devices/agga/daemons:/etc/frr/daemons
        - devices/agga/interfaces:/etc/nrl/interfaces:ro
        - bin/apply-interfaces.sh:/etc/nrl/apply-interfaces.sh:ro
      exec:
        - sh /etc/nrl/apply-interfaces.sh
    aggb:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - devices/aggb/frr.conf:/etc/frr/frr.conf
        - devices/aggb/daemons:/etc/frr/daemons
        - devices/aggb/interfaces:/etc/nrl/interfaces:ro
        - bin/apply-interfaces.sh:/etc/nrl/apply-interfaces.sh:ro
      exec:
        - sh /etc/nrl/apply-interfaces.sh
    corea:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - devices/corea/frr.conf:/etc/frr/frr.conf
        - devices/corea/daemons:/etc/frr/daemons
        - devices/corea/interfaces:/etc/nrl/interfaces:ro
        - bin/apply-interfaces.sh:/etc/nrl/apply-interfaces.sh:ro
      exec:
        - sh /etc/nrl/apply-interfaces.sh
    coreb:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - devices/coreb/frr.conf:/etc/frr/frr.conf
        - devices/coreb/daemons:/etc/frr/daemons
        - devices/coreb/interfaces:/etc/nrl/interfaces:ro
        - bin/apply-interfaces.sh:/etc/nrl/apply-interfaces.sh:ro
      exec:
        - sh /etc/nrl/apply-interfaces.sh
    edgea:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - devices/edgea/frr.conf:/etc/frr/frr.conf
        - devices/edgea/daemons:/etc/frr/daemons
        - devices/edgea/interfaces:/etc/nrl/interfaces:ro
        - bin/apply-interfaces.sh:/etc/nrl/apply-interfaces.sh:ro
      exec:
        - sh /etc/nrl/apply-interfaces.sh
    edgeb:
      kind: linux
      image: frrouting/frr:v8.4.1
      binds:
        - devices/edgeb/frr.conf:/etc/frr/frr.conf
        - devices/edgeb/daemons:/etc/frr/daemons
        - devices/edgeb/interfaces:/etc/nrl/interfaces:ro
        - bin/apply-interfaces.sh:/etc/nrl/apply-interfaces.sh:ro
      exec:
        - sh /etc/nrl/apply-interfaces.sh
    hosta:
      kind: linux
      image: alpine:3.19
      binds:
        - devices/hosta/setup.sh:/etc/nrl/setup.sh:ro
      exec:
        - sh /etc/nrl/setup.sh
    hostb:
      kind: linux
      image: alpine:3.19
      binds:
        - devices/hostb/setup.sh:/etc/nrl/setup.sh:ro
      exec:
        - sh /etc/nrl/setup.sh
    hostc:
      kind: linux
      image: alpine:3.19
      binds:
        - devices/hostc/setup.sh:/etc/nrl/setup.sh:ro
      exec:
        - sh /etc/nrl/setup.sh

  links:
    - endpoints: ["hosta:eth1", "edgea:eth1"]
    - endpoints: ["edgeb:eth1", "hostb:eth1"]
    - endpoints: ["edgeb:eth2", "hostc:eth1"]
    - endpoints: ["edgea:eth2", "agga:eth1"]
    - endpoints: ["agga:eth2", "corea:eth1"]
    - endpoints: ["corea:eth2", "coreb:eth1"]
    - endpoints: ["coreb:eth2", "aggb:eth1"]
    - endpoints: ["aggb:eth2", "edgeb:eth3"]
    - endpoints: ["agga:eth3", "aggb:eth3"]
