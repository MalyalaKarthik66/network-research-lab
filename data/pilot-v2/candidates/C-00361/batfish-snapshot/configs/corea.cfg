corea
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.2/32
    alias router-id and management

auto eth1
iface eth1
    address 10.15.1.2/30
    alias link to edgea siteA (partially reverted)

auto eth2
iface eth2
    address 10.15.2.1/30
    alias link to wan1 ringA

auto eth3
iface eth3
    address 10.15.5.1/30
    alias link to wan2 ringB

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname corea
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to edgea siteA (partially reverted)
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to wan1 ringA
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth3
 description link to wan2 ringB
 ip ospf area 0.0.0.0
 ip ospf cost 40
 ip ospf network point-to-point
!
ip route 10.20.0.0/24 10.15.1.1
!
router ospf
 ospf router-id 10.255.0.2
 passive-interface lo
!
line vty
!
