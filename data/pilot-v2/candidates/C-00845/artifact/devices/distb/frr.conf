frr version 8.4.1
frr defaults traditional
hostname distb
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to aggb aggB
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to edgeb accB
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth3
 description link to dista dist-xlink
 ip ospf area 0.0.0.0
 ip ospf cost 150
 ip ospf network point-to-point
 shutdown
!
router ospf
 ospf router-id 10.255.0.7
 passive-interface lo
!
line vty
!
