frr version 8.4.1
frr defaults traditional
hostname p4
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to p3 core2
 ip ospf area 0.0.0.0
 ip ospf cost 30
 ip ospf network point-to-point
!
interface eth2
 description link to pe4 peB2
 ip ospf area 0.0.0.0
 ip ospf cost 30
 ip ospf network point-to-point
!
interface eth3
 description link to p2 xlink2
 ip ospf area 0.0.0.0
 ip ospf cost 50
 ip ospf network point-to-point
!
ip route 192.0.2.0/24 blackhole
!
router ospf
 ospf router-id 10.255.0.9
 passive-interface lo
!
line vty
!
