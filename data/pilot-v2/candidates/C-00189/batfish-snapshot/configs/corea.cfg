corea
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.2/32
    alias router-id and management

auto eth1
iface eth1
    address 10.13.1.2/30
    alias link to edgea siteA

auto eth2
iface eth2
    address 10.13.2.1/30
    alias link to wan1 wanA1

auto eth3
iface eth3
    address 10.13.5.1/30
    alias link to wan3 wanA2

auto eth4
iface eth4
    address 10.13.9.1/30
    alias link to coreb wan-backup

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname corea
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to edgea siteA
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf network point-to-point
!
interface eth2
 description link to wan1 wanA1
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth3
 description link to wan3 wanA2
 ip ospf area 0.0.0.0
 ip ospf cost 20
 ip ospf network point-to-point
!
interface eth4
 description link to coreb wan-backup
 ip ospf area 0.0.0.0
 ip ospf cost 2
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.2
 passive-interface lo
!
line vty
!
