frr version 8.4.1
frr defaults traditional
hostname a1
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to agga A1
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to a2 A2
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
ip route 10.20.0.10/32 10.29.13.1
!
router ospf
 ospf router-id 10.255.0.3
 passive-interface lo
!
line vty
!
