frr version 8.4.1
frr defaults traditional
hostname p3
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to pe2 pA2
 ip ospf area 0.0.0.0
 ip ospf cost 30
 ip ospf network point-to-point
!
interface eth2
 description link to p4 core2
 ip ospf area 0.0.0.9
 ip ospf cost 30
 ip ospf network point-to-point
!
interface eth3
 description link to p1 xlink1
 ip ospf area 0.0.0.0
 ip ospf cost 50
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.8
 passive-interface lo
!
line vty
!
