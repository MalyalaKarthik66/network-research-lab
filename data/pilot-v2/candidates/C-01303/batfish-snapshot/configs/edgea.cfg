edgea
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.1/32
    alias router-id and management

auto eth1
iface eth1
    address 10.10.0.1/24
    alias link to hosta siteA-lan

auto eth2
iface eth2
    address 10.28.1.1/30
    alias link to g1 accA

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname edgea
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to hosta siteA-lan
 ip ospf area 0.0.0.0
 ip ospf cost 10
!
interface eth2
 description link to g1 accA
 ip ospf area 0.0.0.0
 ip ospf cost 500
 ip ospf network point-to-point
!
ip route 10.20.0.0/25 10.28.3.2
!
router ospf
 ospf router-id 10.255.0.1
 passive-interface lo
 passive-interface eth1
!
line vty
!
