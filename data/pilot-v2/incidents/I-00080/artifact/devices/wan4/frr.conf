frr version 8.4.1
frr defaults traditional
hostname wan4
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to wan3 w4
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to coreb w5
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.6
 passive-interface lo
!
line vty
!
