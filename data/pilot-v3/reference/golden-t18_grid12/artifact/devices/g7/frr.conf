frr version 8.4.1
frr defaults traditional
hostname g7
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to g6 r2a
 ip ospf area 0.0.0.0
 ip ospf cost 20
 ip ospf network point-to-point
!
interface eth2
 description link to g8 r2b
 ip ospf area 0.0.0.0
 ip ospf cost 21
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.8
 passive-interface lo
!
line vty
!
