frr version 8.4.1
frr defaults traditional
hostname g6
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to g7 r2a
 ip ospf area 0.0.0.0
 ip ospf cost 400
 ip ospf network point-to-point
!
interface eth2
 description link to g1 rung1
 ip ospf area 0.0.0.0
 ip ospf cost 30
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.7
 passive-interface lo
!
line vty
!
