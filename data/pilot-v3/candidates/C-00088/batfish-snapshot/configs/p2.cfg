p2
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.4/32
    alias router-id and management

auto eth1
iface eth1
    address 10.26.3.2/30
    alias link to p1 core1

auto eth2
iface eth2
    address 10.26.4.1/30
    alias link to pe3 peB1

auto eth3
iface eth3
    address 10.26.12.1/30
    alias link to p4 xlink2

auto eth4
iface eth4
    address 10.26.19.2/30
    alias link to aggb aggB2

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname p2
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to p1 core1
 ip ospf area 0.0.0.0
 ip ospf cost 200
 ip ospf network point-to-point
!
interface eth2
 description link to pe3 peB1
 ip ospf area 0.0.0.0
 ip ospf cost 11
 ip ospf network point-to-point
!
interface eth3
 description link to p4 xlink2
 ip ospf area 0.0.0.0
 ip ospf cost 50
 ip ospf network point-to-point
!
interface eth4
 description link to aggb aggB2
 ip ospf area 0.0.0.0
 ip ospf cost 60
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.4
 passive-interface lo
!
line vty
!
