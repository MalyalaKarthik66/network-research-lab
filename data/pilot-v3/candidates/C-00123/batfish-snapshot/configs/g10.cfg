g10
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.11/32
    alias router-id and management

auto eth1
iface eth1
    address 10.28.9.2/30
    alias link to g9 r2d

auto eth2
iface eth2
    address 10.28.12.2/30
    alias link to g5 rung3

auto eth3
iface eth3
    address 10.28.14.1/30
    alias link to edgeb accB2

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname g10
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to g9 r2d
 ip ospf area 0.0.0.0
 ip ospf cost 20
 ip ospf network point-to-point
!
interface eth2
 description link to g5 rung3
 ip ospf area 0.0.0.0
 ip ospf cost 31
 ip ospf network point-to-point
!
interface eth3
 description link to edgeb accB2
 ip ospf area 0.0.0.0
 ip ospf cost 40
 ip ospf network point-to-point
!
ip route 10.255.0.10/32 blackhole
!
router ospf
 ospf router-id 10.255.0.11
 passive-interface lo
!
line vty
!
