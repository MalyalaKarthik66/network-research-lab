aggb
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.11/32
    alias router-id and management

auto eth1
iface eth1
    address 10.29.10.2/30
    alias link to b1 B1

auto eth2
iface eth2
    address 10.29.11.1/30
    alias link to edgeb accB

auto eth3
iface eth3
    address 10.29.16.2/30
    alias link to x4 X5

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname aggb
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to b1 B1
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to edgeb accB
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth3
 description link to x4 X5
 ip ospf area 0.0.0.0
 ip ospf cost 800
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.11
 passive-interface lo
!
line vty
!
