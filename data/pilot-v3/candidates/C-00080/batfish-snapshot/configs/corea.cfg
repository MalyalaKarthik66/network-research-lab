corea
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.6/32
    alias router-id and management

auto eth1
iface eth1
    address 10.25.6.2/30
    alias link to dista1 cA1

auto eth2
iface eth2
    address 10.25.7.2/30
    alias link to dista2 cA2

auto eth3
iface eth3
    address 10.25.8.1/30
    alias link to coreb core-link

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname corea
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to dista1 cA1
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to dista2 cA2
 ip ospf area 0.0.0.0
 ip ospf cost 20
 ip ospf network point-to-point
!
interface eth3
 description link to coreb core-link
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
ip route 10.255.0.10/32 blackhole
!
router ospf
 ospf router-id 10.255.0.6
 passive-interface lo
!
line vty
!
