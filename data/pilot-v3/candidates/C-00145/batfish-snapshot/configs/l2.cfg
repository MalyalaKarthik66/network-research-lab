l2
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.5/32
    alias router-id and management

auto eth1
iface eth1
    address 10.30.4.1/30
    alias link to s1 ls3

auto eth2
iface eth2
    address 10.30.5.1/30
    alias link to s2 ls4

auto eth3
iface eth3
    address 10.30.14.2/30
    alias link to agga aggA2

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname l2
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to s1 ls3
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to s2 ls4
 ip ospf area 0.0.0.0
 ip ospf cost 21
 ip ospf network point-to-point
!
interface eth3
 description link to agga aggA2
 ip ospf area 0.0.0.0
 ip ospf cost 50
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.5
 passive-interface lo
!
line vty
!
