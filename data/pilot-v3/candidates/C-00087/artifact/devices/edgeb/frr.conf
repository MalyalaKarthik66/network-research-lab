frr version 8.4.1
frr defaults traditional
hostname edgeb
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to hostb siteB-lan1
 ip ospf area 0.0.0.0
 ip ospf cost 10
!
interface eth2
 description link to hostc siteB-lan2
 ip ospf area 0.0.0.0
 ip ospf cost 10
!
interface eth3
 description link to pe3 peB
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth4
 description link to pe4 peB2b
 ip ospf area 0.0.0.0
 ip ospf cost 600
 ip ospf network point-to-point
!
interface eth5
 description link to aggb aggB
 ip ospf area 0.0.0.0
 ip ospf cost 60
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.6
 passive-interface lo
 passive-interface eth1
 passive-interface eth2
!
line vty
!
