frr version 8.4.1
frr defaults traditional
hostname pe3
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to p2 peB1
 ip ospf area 0.0.0.0
 ip ospf cost 11
 ip ospf network point-to-point
!
interface eth2
 description link to edgeb peB
 ip ospf area 0.0.0.0
 ip ospf cost 200
 ip ospf network point-to-point
!
interface eth3
 description link to rr2 rrB
 ip ospf area 0.0.0.0
 ip ospf cost 20
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.5
 passive-interface lo
!
line vty
!
