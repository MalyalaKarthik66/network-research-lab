frr version 8.4.1
frr defaults traditional
hostname p2
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to p1 core1
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to pe3 peB1
 ip ospf area 0.0.0.0
 ip ospf cost 11
 ip ospf network point-to-point
!
interface eth3
 description link to p4 xlink2
 ip ospf area 0.0.0.0
 ip ospf cost 50
 ip ospf network point-to-point
!
interface eth4
 description link to aggb aggB2
 ip ospf area 0.0.0.0
 ip ospf cost 60
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.4
 passive-interface lo
!
line vty
!
