pe3
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.5/32
    alias router-id and management

auto eth1
iface eth1
    address 10.26.4.2/30
    alias link to p2 peB1

auto eth2
iface eth2
    address 10.26.5.1/30
    alias link to edgeb peB

auto eth3
iface eth3
    address 10.26.15.2/30
    alias link to rr2 rrB

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname pe3
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to p2 peB1
 ip ospf area 0.0.0.0
 ip ospf cost 11
 ip ospf network point-to-point
!
interface eth2
 description link to edgeb peB
 ip ospf area 0.0.0.0
 ip ospf cost 200
 ip ospf network point-to-point
!
interface eth3
 description link to rr2 rrB
 ip ospf area 0.0.0.0
 ip ospf cost 20
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.5
 passive-interface lo
!
line vty
!
