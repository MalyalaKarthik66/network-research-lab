frr version 8.4.1
frr defaults traditional
hostname r1
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to edgea A2
 ip ospf area 0.0.0.0
 ip ospf cost 30
 ip ospf network point-to-point
!
interface eth2
 description link to r2 R1
 ip ospf area 0.0.0.0
 ip ospf cost 600
 ip ospf network point-to-point
!
interface eth3
 description link to l1 rung1
 ip ospf area 0.0.0.0
 ip ospf cost 50
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.6
 passive-interface lo
!
line vty
!
