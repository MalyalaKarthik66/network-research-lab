frr version 8.4.1
frr defaults traditional
hostname g8
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to g7 r2b
 ip ospf area 0.0.0.0
 ip ospf cost 21
 ip ospf network point-to-point
!
interface eth2
 description link to g9 r2c
 ip ospf area 0.0.0.0
 ip ospf cost 22
 ip ospf network point-to-point
!
interface eth3
 description link to g3 rung2
 ip ospf area 0.0.0.0
 ip ospf cost 30
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.9
 passive-interface lo
!
line vty
!
