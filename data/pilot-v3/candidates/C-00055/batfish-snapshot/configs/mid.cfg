mid
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.4/32
    alias router-id and management

auto eth1
iface eth1
    address 10.23.3.2/30
    alias link to a1 M1

auto eth2
iface eth2
    address 10.23.4.2/30
    alias link to a2 M2

auto eth3
iface eth3
    address 10.23.5.1/30
    alias link to b1 M3

auto eth4
iface eth4
    address 10.23.6.1/30
    alias link to b2 M4

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname mid
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to a1 M1
 ip ospf area 0.0.0.0
 ip ospf cost 200
 ip ospf network point-to-point
!
interface eth2
 description link to a2 M2
 ip ospf area 0.0.0.0
 ip ospf cost 21
 ip ospf network point-to-point
!
interface eth3
 description link to b1 M3
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth4
 description link to b2 M4
 ip ospf area 0.0.0.0
 ip ospf cost 21
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.4
 passive-interface lo
!
line vty
!
