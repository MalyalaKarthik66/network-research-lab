p1
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.3/32
    alias router-id and management

auto eth1
iface eth1
    address 10.26.2.2/30
    alias link to pe1 pA1

auto eth2
iface eth2
    address 10.26.3.1/30
    alias link to p2 core1

auto eth3
iface eth3
    address 10.26.11.1/30
    alias link to p3 xlink1

auto eth4
iface eth4
    address 10.26.17.2/30
    alias link to agga aggA2

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname p1
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to pe1 pA1
 ip ospf area 0.0.0.0
 ip ospf cost 11
 ip ospf network point-to-point
!
interface eth2
 description link to p2 core1
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth3
 description link to p3 xlink1
 ip ospf area 0.0.0.0
 ip ospf cost 50
 ip ospf network point-to-point
!
interface eth4
 description link to agga aggA2
 ip ospf area 0.0.0.0
 ip ospf cost 60
 ip ospf network point-to-point
!
ip route 10.255.0.6/32 blackhole
!
router ospf
 ospf router-id 10.255.0.3
 passive-interface lo
!
line vty
!
