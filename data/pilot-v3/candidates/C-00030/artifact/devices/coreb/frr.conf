frr version 8.4.1
frr defaults traditional
hostname coreb
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to wan1 wan-primary
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to wan2 wan-backup
 ip ospf area 0.0.0.0
 ip ospf cost 31
 ip ospf network point-to-point
!
interface eth3
 description link to edgeb siteB
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
ip route 10.255.0.6/32 blackhole
!
router ospf
 ospf router-id 10.255.0.5
 passive-interface lo
!
line vty
!
