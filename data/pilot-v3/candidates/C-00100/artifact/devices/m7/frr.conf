frr version 8.4.1
frr defaults traditional
hostname m7
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to m6 ring6
 ip ospf area 0.0.0.0
 ip ospf cost 400
 ip ospf network point-to-point
!
interface eth2
 description link to m8 ring7
 ip ospf area 0.0.0.0
 ip ospf cost 21
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.9
 passive-interface lo
!
line vty
!
