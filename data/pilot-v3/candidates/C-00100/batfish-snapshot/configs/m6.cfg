m6
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.8/32
    alias router-id and management

auto eth1
iface eth1
    address 10.27.7.2/30
    alias link to m5 ring5

auto eth2
iface eth2
    address 10.27.8.1/30
    alias link to m7 ring6

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname m6
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to m5 ring5
 ip ospf area 0.0.0.0
 ip ospf cost 20
 ip ospf network point-to-point
!
interface eth2
 description link to m7 ring6
 ip ospf area 0.0.0.0
 ip ospf cost 400
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.8
 passive-interface lo
!
line vty
!
