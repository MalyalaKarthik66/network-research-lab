s1
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.3/32
    alias router-id and management

auto eth1
iface eth1
    address 10.30.2.2/30
    alias link to l1 ls1

auto eth2
iface eth2
    address 10.30.4.2/30
    alias link to l2 ls3

auto eth3
iface eth3
    address 10.30.6.2/30
    alias link to l3 ls5

auto eth4
iface eth4
    address 10.30.9.1/30
    alias link to l4 sl1

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname s1
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to l1 ls1
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to l2 ls3
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth3
 description link to l3 ls5
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth4
 description link to l4 sl1
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
ip route 10.255.0.11/32 blackhole
!
router ospf
 ospf router-id 10.255.0.3
 passive-interface lo
!
line vty
!
