frr version 8.4.1
frr defaults traditional
hostname acca2
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to edgea accA2
 ip ospf area 0.0.0.0
 ip ospf cost 40
 ip ospf network point-to-point
!
interface eth2
 description link to dista2 dA2
 ip ospf area 0.0.0.0
 ip ospf cost 200
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.5
 passive-interface lo
!
line vty
!
