s2
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.4/32
    alias router-id and management

auto eth1
iface eth1
    address 10.30.3.2/30
    alias link to l1 ls2

auto eth2
iface eth2
    address 10.30.5.2/30
    alias link to l2 ls4

auto eth3
iface eth3
    address 10.30.8.2/30
    alias link to l6 ls6

auto eth4
iface eth4
    address 10.30.10.1/30
    alias link to l5 sl2

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname s2
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to l1 ls2
 ip ospf area 0.0.0.0
 ip ospf cost 20
 ip ospf network point-to-point
!
interface eth2
 description link to l2 ls4
 ip ospf area 0.0.0.0
 ip ospf cost 21
 ip ospf network point-to-point
!
interface eth3
 description link to l6 ls6
 ip ospf area 0.0.0.0
 ip ospf cost 21
 ip ospf network point-to-point
!
interface eth4
 description link to l5 sl2
 ip ospf area 0.0.0.0
 ip ospf cost 420
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.4
 passive-interface lo
!
line vty
!
