frr version 8.4.1
frr defaults traditional
hostname s2
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to l1 ls2
 ip ospf area 0.0.0.0
 ip ospf cost 20
 ip ospf network point-to-point
!
interface eth2
 description link to l2 ls4
 ip ospf area 0.0.0.0
 ip ospf cost 21
 ip ospf network point-to-point
!
interface eth3
 description link to l6 ls6
 ip ospf area 0.0.0.0
 ip ospf cost 21
 ip ospf network point-to-point
!
interface eth4
 description link to l5 sl2
 ip ospf area 0.0.0.0
 ip ospf cost 420
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.4
 passive-interface lo
!
line vty
!
