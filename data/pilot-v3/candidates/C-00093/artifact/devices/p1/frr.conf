frr version 8.4.1
frr defaults traditional
hostname p1
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to pe1 pA1
 ip ospf area 0.0.0.0
 ip ospf cost 11
 ip ospf network point-to-point
!
interface eth2
 description link to p2 core1
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth3
 description link to p3 xlink1
 ip ospf area 0.0.0.0
 ip ospf cost 50
 ip ospf network point-to-point
!
interface eth4
 description link to agga aggA2
 ip ospf area 0.0.0.0
 ip ospf cost 60
 ip ospf network point-to-point
!
ip route 10.255.0.13/32 blackhole
!
router ospf
 ospf router-id 10.255.0.3
 passive-interface lo
!
line vty
!
