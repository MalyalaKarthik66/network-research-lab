frr version 8.4.1
frr defaults traditional
hostname b1
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to mid M3
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
interface eth2
 description link to edgeb B1
 ip ospf area 0.0.0.0
 ip ospf cost 10
 ip ospf network point-to-point
!
ip route 10.255.0.2/32 blackhole
!
router ospf
 ospf router-id 10.255.0.5
 passive-interface lo
!
line vty
!
