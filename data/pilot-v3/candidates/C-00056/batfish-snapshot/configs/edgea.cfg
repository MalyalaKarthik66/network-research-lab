edgea
# This file describes the network interfaces
# generated by nrl -- do not hand-edit; edit the scenario model

auto lo
iface lo inet loopback
    address 10.255.0.1/32
    alias router-id and management

auto eth1
iface eth1
    address 10.10.0.1/24
    alias link to hosta siteA-lan

auto eth2
iface eth2
    address 10.24.1.1/30
    alias link to l1 A1

auto eth3
iface eth3
    address 10.24.5.1/30
    alias link to r1 A2

# ports.conf --
# virtual node: no physical breakout ports
1=10G
2=10G
3=10G
4=10G
frr version 8.4.1
frr defaults traditional
hostname edgea
log syslog informational
service integrated-vtysh-config
!
interface lo
 description router-id and management
 ip ospf area 0.0.0.0
!
interface eth1
 description link to hosta siteA-lan
 ip ospf area 0.0.0.0
 ip ospf cost 10
!
interface eth2
 description link to l1 A1
 ip ospf area 0.0.0.0
 ip ospf cost 200
 ip ospf network point-to-point
!
interface eth3
 description link to r1 A2
 ip ospf area 0.0.0.0
 ip ospf cost 30
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.1
 passive-interface lo
 passive-interface eth1
!
line vty
!
