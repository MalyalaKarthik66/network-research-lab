# golden property suite -- FROZEN, version 1.1.0
# in_spec: true  -> asked of Batfish in Phase 2 (the specification)
# in_spec: false -> measured in Containerlab in Phase 3 only
#                   (the declared blind spots)
suite_version: "1.1.0"
properties:
  - pid: P01
    kind: "reachability"
    in_spec: true
    src: "10.10.0.10"
    dst: "10.20.0.10"
    app: "ICMP"
    text: "hosta can ping hostb"
  - pid: P02
    kind: "reachability"
    in_spec: true
    src: "10.10.0.10"
    dst: "10.20.0.10"
    app: "HTTPS"
    text: "hosta can reach hostb on TCP/443"
  - pid: P05
    kind: "reachability"
    in_spec: true
    src: "10.20.0.10"
    dst: "10.10.0.10"
    app: "ICMP"
    text: "hostb can ping hosta (return path)"
  - pid: P07
    kind: "no_loops"
    in_spec: true
    text: "no forwarding loops anywhere"
  - pid: P08
    kind: "ospf_adjacencies"
    in_spec: true
    expected: PER_TOPOLOGY   # resolved below
    text: "all six OSPF adjacencies are established"
  - pid: P03
    kind: "reachability"
    in_spec: false
    src: "10.10.0.10"
    dst: "10.21.0.10"
    app: "ICMP"
    text: "hosta can ping hostc (second site-B LAN)"
  - pid: P04
    kind: "reachability"
    in_spec: false
    src: "10.10.0.10"
    dst: "10.21.0.10"
    app: "HTTPS"
    text: "hosta can reach hostc on TCP/443"
  - pid: P06
    kind: "path_contains"
    in_spec: false
    src: "10.10.0.10"
    dst: "10.20.0.10"
    must_traverse: PER_TOPOLOGY   # resolved below
    text: "hosta->hostb uses the primary WAN, not the backup"
  - pid: P09
    kind: "route_present"
    in_spec: false
    prefix: "10.20.0.0/24"
    nodes: "all_routers"
    text: "every router has a route to 10.20.0.0/24"
  - pid: P10
    kind: "route_present"
    in_spec: false
    prefix: "10.21.0.0/24"
    nodes: "all_routers"
    text: "every router has a route to 10.21.0.0/24"
  - pid: P11
    kind: "reachability"
    in_spec: false
    src: PER_TOPOLOGY   # resolved below
    dst: PER_TOPOLOGY   # resolved below
    app: "ICMP"
    text: "edgea loopback can reach edgeb loopback"
  - pid: P12
    kind: "no_iface_down"
    in_spec: false
    text: "no interface is administratively down"

# Values that depend on the topology. properties_for(spec)
# fills these in; they are recorded here so the suite that
# was actually evaluated is fully reconstructable.
topology_resolved:
  t03_dual8:
    P06_must_traverse: ['corea', 'wan1', 'wan2', 'coreb']
    P08_expected_adjacencies: 9
    P11_src_edgea_loopback: "10.255.0.1"
    P11_dst_edgeb_loopback: "10.255.0.8"
